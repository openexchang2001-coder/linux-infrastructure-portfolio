groups:
  - name: minecraft-availability
    rules:
      - alert: MinecraftServerDown
        expr: minecraft_status_healthy == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Minecraft Java server is unreachable
          description: mc-monitor has reported an unhealthy status for over 2 minutes.

      - alert: MinecraftMonitoringUnavailable
        expr: up{job="mc-monitor"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: mc-monitor exporter is unreachable
          description: Prometheus cannot scrape mc-monitor for over 2 minutes.

      - alert: MinecraftMetricsMissing
        expr: absent_over_time(minecraft_status_healthy{job="mc-monitor"}[2m])
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Minecraft monitoring metrics are missing
          description: Minecraft health metrics have been absent for over 2 minutes.

  - name: last7days.minecraft
    rules:
      - alert: Last7DaysMinecraftDown
        expr: |
          (minecraft_status_healthy{job="last7days-minecraft"} == 0)
          or (up{job="last7days-minecraft"} == 0)
          or absent(minecraft_status_healthy{job="last7days-minecraft"})
        for: 2m
        labels:
          severity: critical
          service: last7days
        annotations:
          summary: "LAST 7 DAYS Minecraft server unavailable"
          description: "Minecraft or its monitoring endpoint has been unavailable for over 2 minutes."
