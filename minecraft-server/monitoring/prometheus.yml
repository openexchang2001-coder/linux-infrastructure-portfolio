global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:

  - job_name: last7days-minecraft
    static_configs:
      - targets: ["last7days-mc-monitor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: mc-monitor
    static_configs:
      - targets: ["mc-monitor:8080"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: docker-exporter
    static_configs:
      - targets: ["docker-exporter:8080"]
